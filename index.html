<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in AI Studio preview iframe where HMR is disabled
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect to websocket') || args[0].includes('[vite] connecting...'))) {
            return;
          }
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('[vite]')) {
            return;
          }
          origWarn.apply(console, args);
        };
      })();
    </script>
